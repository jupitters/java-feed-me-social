spring.application.name=feed-me

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc://postgresql://localhost:5432/feedme}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:feedme}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:feedme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=true

feed.async.enabled=true
feed.async.stream.key=feed:events
feed.async.consumer.group=feed-wworkers
feed.async.consumer.name=worker-1
feed.async.consumer.max-processing-attempts=5
feed.async.consumer.dlq-stream-key=feed:events:dlq
feed.async.consumer.reclaim-enabled=true
feed.async.consumer.reclaims-fixed-delay-ms=5000
feed.async.consumer.reclaim-idle-ms=30000
feed.async.consumer.reclaim-batch-size=50

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
